title: Pixellize Blog
description: Notes on tools, web, and building things.
author: Shubham Ralli

# Project site served at https://shubham-ralli.github.io/blog
url: "https://shubham-ralli.github.io"
baseurl: "/blog"

theme: minima

# Clean URLs: no category, no date, no .html -> /blog/<slug>/
permalink: /:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# posts per page defaults; minima lists all posts on home
show_excerpts: true
